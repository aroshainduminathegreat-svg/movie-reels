<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineVault – Discover Movies</title>
  <meta name="description" content="CineVault: a cinematic movie discovery platform. Browse trending, popular and top rated movies.">
  <meta name="theme-color" content="#0b0c10">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header id="site-header" class="site-header"></header>
  <main>
    <section id="hero" class="hero" aria-live="polite"><div class="hero-loading"><div class="spinner"></div></div></section>
    <div class="dots" id="hero-dots"></div>
    <div class="wrap" id="rows"></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <noscript><p style="padding:2rem;text-align:center">CineVault needs JavaScript enabled.</p></noscript>
  <script src="movies-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
